name: ci

# Builds the pinned core, packages the pak, and validates it against the
# content-pak contract at a pinned leaf-contracts SHA.
#
# Nothing here assumes a UMRK workspace layout: the runner starts from a bare
# clone of this repository, exactly like an outside contributor's machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pin the contract, not a branch. A moving contract that silently changes
  # what "valid" means is the thing this pin exists to prevent; bumping it is
  # a reviewed commit here.
  CONTRACT_REF: 5c7404376ed5462bf67f886256af2321a4dc6d76

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned contract
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/leaf-contracts
          ref: ${{ env.CONTRACT_REF }}
          path: .contract

      - name: Validate pak.json against content-paks-v1
        run: make validate CONTRACT_DIR="$PWD/.contract"

      - name: Refuse a launch.sh
        run: |
          # This repository is the PURE content-pak reference. A launch.sh
          # would quietly turn it into a hybrid and change how both the
          # storefront and the launcher treat it.
          if [ -e pak/launch.sh ]; then
            echo "pak/launch.sh present: this is meant to be a pure content pak" >&2
            exit 1
          fi

      - name: Refuse a path that escapes the repository
        run: |
          # The whole point of this repository is that someone can clone it
          # and build. A '../' in the build system means they cannot.
          if grep -REn '\.\./(Cores-spruce|Leaf|Jawaka|Catastrophe|umrk-workspace|mlp1-toolchain)' \
               Makefile core scripts .github 2>/dev/null; then
            echo "build system references a sibling checkout" >&2
            exit 1
          fi
          echo "no sibling-checkout references"

  build:
    runs-on: ubuntu-latest
    # The core build is long. Keep it off the PR path but never let main drift.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build the pinned core
        run: make core

      - name: Package and hash
        run: make dist-pakrat

      - name: Corresponding source (GPLv3)
        run: make dist-source

      - name: Check out the pinned contract
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/leaf-contracts
          ref: ${{ env.CONTRACT_REF }}
          path: .contract

      - name: Validate the PACKAGED pak strictly
        run: |
          python3 scripts/validate-pak.py \
            --contract "$PWD/.contract" \
            --pak build/package/ScummVM.pak --packaged

      - uses: actions/upload-artifact@v4
        with:
          name: ScummVM-pak
          path: |
            build/dist/ScummVM.mlp1.pak.zip
            build/dist/scummvm-corresponding-source.tar.gz
            build/dist/core.lock.json
